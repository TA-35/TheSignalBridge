# Reverse proxy for the Flask/gunicorn backend on EC2.
# TLS is terminated here via certbot (Let's Encrypt); gunicorn binds to a local socket/port only.

server {
    listen 80;
    server_name api.example.com;  # TODO: replace with the real domain

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name api.example.com;  # TODO: replace with the real domain

    # ssl_certificate and ssl_certificate_key are managed by certbot.

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
