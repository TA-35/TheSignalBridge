# Frontend and Flask/gunicorn backend servers on EC2.
# Plain HTTP only, on purpose: `certbot --nginx` rewrites this file to add
# the TLS server block (with the right ssl_certificate paths) and the
# 80->443 redirect once the certificate exists. Hand-writing a 443 block
# ahead of that fails `nginx -t` (no cert to point at yet), so leave it out
# and let certbot add it on first run. Keep the auth directives on the HTTPS
# server block after Certbot creates it.

server {
    listen 80;
    server_name thesignalbridge.com www.thesignalbridge.com;

    auth_basic "TheSignalBridge";
    auth_basic_user_file /etc/nginx/.htpasswd;

    root /home/ubuntu/app/frontend/dist;
    index index.html;

    location ^~ /.well-known/acme-challenge/ {
        auth_basic off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    server_name api.thesignalbridge.com;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
