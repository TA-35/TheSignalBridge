# Reverse proxy for the Flask/gunicorn backend on EC2.
# Plain HTTP only, on purpose: `certbot --nginx` rewrites this file to add
# the TLS server block (with the right ssl_certificate paths) and the
# 80->443 redirect once the certificate exists. Hand-writing a 443 block
# ahead of that fails `nginx -t` (no cert to point at yet), so leave it out
# and let certbot add it on first run.
#
# This box serves api.thesignalbridge.com and nothing else. The website is a
# private S3 bucket behind CloudFront, so the shared website password lives in
# infra/cloudfront/basic-auth.js - a server block for thesignalbridge.com here
# would never receive a request, because that name does not resolve to this
# host.

server {
    listen 80;
    server_name api.thesignalbridge.com;

    # Rejects an oversized request at the proxy, before it reaches
    # gunicorn/Flask at all. Kept a bit above Flask's own MAX_CONTENT_LENGTH
    # (100 KB, see backend/app/config.py) so that limit is
    # what actually produces the app's JSON error body in the normal case.
    client_max_body_size 150k;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
