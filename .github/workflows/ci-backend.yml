name: CI - backend

# Checks only, on every PR and push to main. Deploying stays a manual
# workflow_dispatch (backend-deploy.yml) - nothing here reaches EC2 or RDS.
#
# The tests need no database and no .env: they use in-memory SQLite, and
# tests/conftest.py supplies a placeholder SECRET_KEY.

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/ci-backend.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/ci-backend.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt ruff==0.16.10

      # Syntax errors and undefined names only - the full rule set reports
      # ~50 style findings that are a separate clean-up.
      - name: Lint (ruff, fatal errors only)
        run: ruff check --select E9,F63,F7,F82 .

      - name: Test
        run: python -m pytest -q
