name: Backend deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest

      # Deploy keys are disabled on this org's repos, so EC2 can't `git pull`
      # for itself - this pushes the code to EC2 instead, over SSH, using a
      # CI-only key (see the setup notes below the deploy step).
      - name: Push backend/ to EC2
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts
          rsync -az --delete \
            --exclude '.venv' --exclude '.env' --exclude '__pycache__' --exclude '.pytest_cache' \
            -e "ssh -i ~/.ssh/deploy_key" \
            ./ ubuntu@${{ secrets.EC2_HOST }}:~/app/

      - name: Install deps, migrate, restart
        run: |
          ssh -i ~/.ssh/deploy_key ubuntu@${{ secrets.EC2_HOST }} '
            set -e
            cd ~/app
            source .venv/bin/activate
            pip install -r requirements.txt
            export FLASK_APP=wsgi.py
            flask db upgrade
            sudo systemctl restart backend
          '

      - name: Smoke test
        run: curl -sf https://api.thesignalbridge.com/api/patterns > /dev/null
