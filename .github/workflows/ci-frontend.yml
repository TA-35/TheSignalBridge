name: CI - frontend

# Checks only, on every PR and push to main. Deploying stays a manual
# workflow_dispatch (frontend-deploy.yml) - nothing here touches AWS.
#
# prettier --check is not here yet: 22 files are unformatted on main. It
# joins once they are formatted (see .github/CLAUDE.md).

on:
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/ci-frontend.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/ci-frontend.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          # package.json engines: ^22.18.0 || >=24.12.0
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci

      - name: Type check
        run: npm run type-check

      # Not `npm run lint`: that script runs with --fix, which would rewrite
      # the checkout and pass instead of failing.
      - name: Lint (oxlint)
        run: npx oxlint --deny-warnings .

      - name: Lint (eslint)
        run: npx eslint . --max-warnings 0

      - name: Build
        run: npm run build-only

      # Runtime dependencies only - they are what ships in the bundle. The
      # dev tree has a high advisory in braces (via @vue/eslint-config-
      # typescript) with no fixed release; npm's only offer is a breaking
      # downgrade. Dependabot tracks it instead.
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high
